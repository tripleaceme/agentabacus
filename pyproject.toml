[project]
name = "agentabacus"
version = "0.2.0"
description = "Local-first analytics for AI coding agents. Reads the session logs already on your disk."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ayoade Adegbite" }]
keywords = ["claude", "codex", "llm", "analytics", "duckdb", "agents", "cost"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "duckdb>=1.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/tripleaceme/agentabacus"
Issues = "https://github.com/tripleaceme/agentabacus/issues"

[project.scripts]
agentabacus = "agentabacus.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentabacus"]

# An allowlist, not an exclude list: `exclude = ["assets/"]` silently did not
# match and the 468 KB social preview shipped anyway, taking the sdist from
# ~30 KB to 494 KB. Naming what belongs in a source distribution fails loudly
# if it is wrong, instead of quietly shipping whatever is lying around.
[tool.hatch.build.targets.sdist]
only-include = [
    "src/agentabacus",
    "tests",
    "README.md",
    "LICENSE",
    "CONTRIBUTING.md",
    "pyproject.toml",
]
