name: release

# Merging to main publishes to PyPI. No manual tagging, no version to bump by
# hand, nothing committed back to main.
#
# The version IS the git tag (hatch-vcs), so a release is: work out the next
# number from the merge commit subject, create the tag, build, publish.
# Creating a tag does not write to a protected branch, so this keeps working
# under branch protection rules that would reject a bot pushing to main.
#
# Bump size comes from the squash-merge subject, which GitHub takes from the
# PR title:
#     feat!: ... / BREAKING CHANGE  -> minor while pre-1.0, major after
#     feat: ...                     -> minor
#     anything else                 -> patch
#
# Put [skip release] in the merge subject to merge without publishing.
#
# One-time PyPI setup (https://pypi.org/manage/account/publishing/):
#   project agentabacus | owner tripleaceme | repo agentabacus
#   workflow release.yml | environment pypi

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Force a bump size"
        required: false
        default: ""
        type: choice
        options: ["", "patch", "minor", "major"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Decide the version
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    outputs:
      version: ${{ steps.next.outputs.version }}
      publish: ${{ steps.next.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # A README-only merge should not cut a release.
      - name: Does this merge ship anything?
        id: paths
        run: |
          CHANGED=$(git diff --name-only "${{ github.event.before }}".."${{ github.sha }}" 2>/dev/null || echo "src/")
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(src/|pyproject\.toml)'; then
            echo "ship=true" >> "$GITHUB_OUTPUT"
          else
            echo "ship=false" >> "$GITHUB_OUTPUT"
            echo "::notice::nothing under src/ changed - no release"
          fi

      - name: Compute the next version
        id: next
        run: |
          if [ "${{ steps.paths.outputs.ship }}" != "true" ] && [ -z "${{ inputs.bump }}" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SUBJECT=$(git log -1 --pretty=%B)
          case "${{ inputs.bump }}" in
            major) SUBJECT="feat!: forced major" ;;
            minor) SUBJECT="feat: forced minor" ;;
            patch) SUBJECT="fix: forced patch" ;;
          esac
          VERSION=$(python scripts/next_version.py "$SUBJECT")
          echo "next version: $VERSION"
          {
            echo "version=$VERSION"
            echo "publish=true"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Test, tag and build
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write     # to create the tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - run: uv pip install --system -e ".[dev]"

      # Nothing publishes that has not passed the same gates a PR does.
      - run: python -m pytest -q
      - run: python scripts/validate_adapters.py

      - name: Tag v${{ needs.version.outputs.version }}
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "agentabacus $V"
          git push origin "v$V"

      # hatch-vcs reads the tag created above, so the artefacts carry the real
      # version rather than a dev suffix.
      - run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # Trusted Publishing; no token stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  announce:
    name: GitHub release
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$V" \
            --title "v$V" \
            --generate-notes \
            --notes "Install: \`pip install --upgrade agentabacus==$V\`"
